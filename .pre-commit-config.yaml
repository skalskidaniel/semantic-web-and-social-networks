repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check src
        language: system
        types: [python]
        pass_filenames: false
      - id: lint-imports
        name: import-linter contracts
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
