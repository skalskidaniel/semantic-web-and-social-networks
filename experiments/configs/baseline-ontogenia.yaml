# Ontogenia baseline as in Lippolis et al. (ESWC 2025): one CQ per call, ontology so far in context, MP + ODPs, no validation.
name: baseline-ontogenia
data_dir: data
results_dir: experiments/results
ontologies: all
use_description: false
llm:
  provider: claude-code   # or: anthropic | openai (pip extra) | fake (offline heuristic)
  model: claude-sonnet-5-5
  temperature: 0.0
  max_tokens: 16000
  seed: 42
  cache_dir: .cache/llm
evaluation:
  threshold: 0.85
  posthoc_coverage: true
  final_consistency: true
system:
  kind: ontogenia
  baseline_mode: cq_by_cq
  use_patterns: true
